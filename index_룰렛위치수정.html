<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>New 아이폰18 사전예약 럭키 룰렛</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:linear-gradient(145deg,#07152d,#111827 55%,#160b3c);
 color:#fff;font-family:Arial,"Noto Sans KR","Malgun Gothic",sans-serif;
 min-height:100vh;
}
.wrap{width:100%;max-width:700px;margin:auto;padding:28px 18px 110px;text-align:center}
.badge{font-size:15px;font-weight:900;background:#ef3d78;display:inline-block;padding:8px 15px;border-radius:30px;margin-bottom:12px}
h1{margin:0;font-size:clamp(38px,10vw,62px);font-weight:1000;letter-spacing:-3px}
h1 span{color:#ff65ae}
.sub{font-size:25px;font-weight:900;margin:18px 0 14px}
.benefit{display:inline-block;background:#fff;color:#2670ad;font-size:22px;font-weight:1000;border-radius:16px;padding:15px 25px;margin-bottom:30px}
.guide{background:#fff;color:#202020;border-radius:25px;padding:25px 14px;font-size:22px;font-weight:900;line-height:1.35;margin-bottom:20px}
.inputrow{display:flex;gap:0;max-width:580px;margin:auto}
input{min-width:0;flex:1;border:2px solid #ddd;border-radius:18px 0 0 18px;padding:18px 20px;font-size:20px;outline:none}
#start{width:145px;border:0;border-radius:0 18px 18px 0;background:#3e22e8;color:white;font-size:20px;font-weight:1000;cursor:pointer}
#start:disabled{opacity:.55}
.wheel-wrap{position:relative;width:min(620px,96vw);aspect-ratio:1;margin:35px auto 20px}
canvas{width:100%;height:100%;display:block}
.pointer{
 position:absolute;z-index:5;top:-1px;left:50%;transform:translateX(-50%);
 width:0;height:0;border-left:27px solid transparent;border-right:27px solid transparent;
 border-top:55px solid #2861d5;filter:drop-shadow(0 3px 2px #0005)
}
.pointer:after{
 content:"";position:absolute;left:-11px;top:-50px;width:22px;height:22px;background:white;border-radius:50%;
}
.center{
 position:absolute;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);
 width:180px;height:180px;border-radius:50%;
 background:linear-gradient(135deg,#287be6,#8736db);
 border:12px solid #1763aa;
 box-shadow:0 8px 0 #123f77;
 display:flex;align-items:center;justify-content:center;
 font-size:31px;font-weight:1000;letter-spacing:1px;
}
.note{font-size:14px;color:#c5cbd6;line-height:1.6}
.result{display:none;background:white;color:#222;border-radius:22px;padding:22px;margin-top:20px}
.result.show{display:block}
.result small{color:#777}.prize{font-size:38px;font-weight:1000;color:#e11d48;margin-top:5px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#3d18e8;padding:18px;text-align:center;font-size:23px;font-weight:1000}
@media(max-width:430px){
 .wrap{padding-left:10px;padding-right:10px}
 .guide{font-size:19px}
 input{font-size:17px;padding:17px 12px}
 #start{width:120px;font-size:18px}
 .center{width:150px;height:150px;font-size:26px;border-width:10px}
 .pointer{border-left-width:22px;border-right-width:22px;border-top-width:48px}
}
</style>
</head>
<body>
<div class="wrap">
 <div class="badge">SK동대신점 특별 이벤트</div>
 <h1>New <span>아이폰18</span></h1>
 <div class="sub">사전예약 럭키 룰렛</div>
 <div class="benefit">최대 20만원 할인 혜택</div>

 <div class="guide">휴대폰 번호를 입력하고<br>START 버튼을 눌러 룰렛을 돌려주세요!</div>

 <div class="inputrow">
   <input id="phone" type="tel" maxlength="11" placeholder="01012345678 (선택)">
   <button id="start">참여하기</button>
 </div>

 <div class="wheel-wrap">
   <div class="pointer"></div>
   <canvas id="wheel" width="1000" height="1000"></canvas>
   <div class="center">START</div>
 </div>

 <div class="note">※ 1인 1회 참여 권장 · 사전예약 상담 고객 대상 · 혜택은 매장 정책에 따라 적용</div>

 <div id="result" class="result">
   <small>🎉 당첨 결과</small>
   <div id="prize" class="prize"></div>
   <div>축하드립니다! 매장에서 할인 혜택을 확인해주세요.</div>
 </div>
</div>
<div class="bottom">New 아이폰18 사전예약 참여하기</div>

<script>
const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");
const startBtn=document.getElementById("start");
const phone=document.getElementById("phone");
const result=document.getElementById("result");
const prizeEl=document.getElementById("prize");

const prizes=[
 {name:"20만원", weight:20},
 {name:"15만원", weight:30},
 {name:"10만원", weight:50}
];

let rotation=0, spinning=false;

function drawWheel(){
 const cx=500,cy=500,r=470;
 const slice=2*Math.PI/prizes.length;
 ctx.clearRect(0,0,1000,1000);

 prizes.forEach((p,i)=>{
   const start=-Math.PI/2 + rotation + i*slice;
   const end=start+slice;

   ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,start,end);ctx.closePath();
   ctx.fillStyle=["#f8c8dc","#cfe2f7","#fff"][i];
   ctx.fill();
   ctx.lineWidth=8;ctx.strokeStyle="#fff";ctx.stroke();

   // 글자는 각 칸의 정확한 중앙에 배치하고,
   // 회전해도 항상 포인터 기준으로 자연스럽게 보이도록 radial 방향으로 정렬
   const mid=start+slice/2;
   const tx=cx+Math.cos(mid)*r*0.64;
   const ty=cy+Math.sin(mid)*r*0.64;

   ctx.save();
   ctx.translate(tx,ty);
   let a=mid+Math.PI/2;
   // 글자가 거꾸로 보이지 않게 보정
   if(a>Math.PI/2 && a<3*Math.PI/2) a-=Math.PI;
   ctx.rotate(a);
   ctx.textAlign="center";ctx.textBaseline="middle";
   ctx.fillStyle="#172b5f";
   ctx.font="900 58px Arial";
   ctx.fillText(p.name,0,0);
   ctx.restore();
 });

 ctx.beginPath();ctx.arc(cx,cy,r,0,2*Math.PI);
 ctx.lineWidth=14;ctx.strokeStyle="#55a0ef";ctx.stroke();
}

function weightedPick(){
 const total=prizes.reduce((s,p)=>s+p.weight,0);
 let n=Math.random()*total;
 for(const p of prizes){n-=p.weight;if(n<0)return p.name}
 return prizes[2].name;
}

function spin(){
 if(spinning)return;
 spinning=true;startBtn.disabled=true;result.classList.remove("show");

 const selected=weightedPick();
 const idx=prizes.findIndex(p=>p.name===selected);
 const slice=360/prizes.length;

 // 해당 칸의 중앙이 정확히 12시 포인터에 오도록 목표 각도 계산
 const centerDeg=idx*slice+slice/2;
 const currentDeg=rotation*180/Math.PI;
 const turns=7*360;
 const targetDeg=currentDeg + turns + (360-centerDeg-currentDeg)%360;

 const begin=currentDeg;
 const duration=4800;
 const t0=performance.now();

 function frame(now){
   const t=Math.min(1,(now-t0)/duration);
   const ease=1-Math.pow(1-t,4);
   const deg=begin+(targetDeg-begin)*ease;
   rotation=deg*Math.PI/180;
   drawWheel();

   if(t<1) requestAnimationFrame(frame);
   else{
     prizeEl.textContent=selected+" 할인";
     result.classList.add("show");
     startBtn.disabled=false;
     spinning=false;
   }
 }
 requestAnimationFrame(frame);
}
startBtn.addEventListener("click",spin);
drawWheel();
</script>
</body>
</html>
