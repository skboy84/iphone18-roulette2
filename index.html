<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SK동대신점 New iPhone 18 사전예약 럭키 룰렛</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07101d;color:#fff;font-family:Arial,'Noto Sans KR',sans-serif;text-align:center}
main{max-width:720px;min-height:100vh;margin:auto;padding:28px 18px 90px;background:radial-gradient(circle at 20% 20%,#203a62,transparent 35%),linear-gradient(145deg,#05080e,#15243a)}
.brand{font-weight:900;font-size:18px}.title{font-size:44px;font-weight:950;margin:8px 0;color:#fff}.pink{color:#ff86c8}.sub{font-size:22px;font-weight:900}
.badge{display:inline-block;background:#fff;color:#1768b7;padding:9px 15px;border-radius:8px;margin:14px 0;font-weight:950}
.box{background:#fff;color:#222;border-radius:16px;padding:14px;margin:12px auto;max-width:430px;font-weight:900}
input{width:68%;padding:13px;border:1px solid #ccd5e0;border-radius:10px;font-size:16px}button{border:0;border-radius:10px;padding:13px 15px;background:#3a22e5;color:#fff;font-weight:900}
.roulette{position:relative;width:min(88vw,560px);aspect-ratio:1;margin:25px auto}.wheel{position:absolute;inset:0;border:12px solid #4f9cff;border-radius:50%;background:conic-gradient(#ffd2e7 0 120deg,#d9ecff 120deg 240deg,#fff 240deg 360deg);box-shadow:0 0 0 5px #b9dcff,0 20px 45px #0009;transition:transform 4.5s cubic-bezier(.12,.72,.12,1)}
.label{position:absolute;left:50%;top:50%;font-size:27px;font-weight:950;color:#182b68;white-space:nowrap}.l1{transform:rotate(-60deg) translate(105px,-50%)}.l2{transform:rotate(60deg) translate(105px,-50%)}.l3{transform:rotate(180deg) translate(105px,-50%)}
.pointer{position:absolute;z-index:3;left:50%;top:-4px;transform:translateX(-50%);width:62px;height:85px;background:#2858d7;clip-path:polygon(50% 100%,5% 32%,50% 0,95% 32%)}.pointer:after{content:'';position:absolute;left:20px;top:13px;width:22px;height:22px;border-radius:50%;background:#fff}
.start{position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);width:140px;height:140px;border-radius:50%;font-size:27px;background:linear-gradient(145deg,#147de2,#b52fe3);border:8px solid #2588e8;box-shadow:0 8px #17499d}
.note{font-size:13px;color:#bdcad8}.bottom{position:fixed;bottom:0;left:0;right:0;margin:auto;max-width:720px;height:72px;background:#3518dc;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:950}
.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:20px}.card{background:#fff;color:#222;border-radius:22px;padding:30px;width:min(90vw,400px)}.win{font-size:50px;font-weight:950;color:#286ef1;margin:12px}.close{background:#3518dc}
</style></head>
<body><main>
<div class="brand">SK동대신점 특별 이벤트 🎁</div>
<div class="title">New <span class="pink">아이폰18</span></div>
<div class="sub">사전예약 럭키 룰렛</div>
<div class="badge">최대 20만원 할인 혜택</div>
<div class="box">휴대폰 번호를 입력하고<br>START 버튼을 눌러 룰렛을 돌려주세요!</div>
<div><input id="phone" inputmode="numeric" maxlength="11" placeholder="01012345678 (선택)"><button id="join">참여하기</button></div>
<div class="roulette"><div id="wheel" class="wheel"><div class="label l1">20만원</div><div class="label l2">15만원</div><div class="label l3">10만원</div></div><div class="pointer"></div><button id="start" class="start" disabled>START</button></div>
<div class="note">※ 1인 1회 참여 권장 · 사전예약 상담 고객 대상 · 혜택은 매장 정책에 따라 적용</div>
</main><div class="bottom">New 아이폰18 사전예약 참여하기</div>
<div id="modal" class="modal"><div class="card"><h2>🎉 축하드립니다!</h2><div id="win" class="win"></div><p>당첨 화면을 매장 직원에게 보여주세요.</p><button class="close" onclick="modal.style.display='none'">확인</button></div></div>
<script>
const prizes=['20만원','15만원','10만원'],wheel=document.getElementById('wheel'),start=document.getElementById('start'),join=document.getElementById('join'),phone=document.getElementById('phone'),modal=document.getElementById('modal'),win=document.getElementById('win');
let rot=0,ok=false,busy=false;
join.onclick=()=>{let p=phone.value.replace(/\D/g,'');if(p&&!/^010\d{8}$/.test(p)){alert('휴대폰 번호 11자리를 확인해주세요.');return}ok=true;phone.disabled=true;join.disabled=true;join.textContent='참여 준비 완료';start.disabled=false};
start.onclick=()=>{if(!ok||busy)return;busy=true;start.disabled=true;let i=Math.floor(Math.random()*3),target=360-(i*120+60);rot+=2160+target;wheel.style.transform='rotate('+rot+'deg)';setTimeout(()=>{win.textContent=prizes[i];modal.style.display='flex';busy=false},4600)};
</script></body></html>
