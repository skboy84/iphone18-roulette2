<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New 아이폰18 사전예약 럭키 룰렛</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",sans-serif;
  background:linear-gradient(135deg,#111827,#3b0764);
  color:#fff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}
.wrap{
  width:min(560px,100%);
  text-align:center;
}
.badge{
  display:inline-block;
  background:#e11d48;
  padding:8px 16px;
  border-radius:999px;
  font-weight:800;
  font-size:14px;
  margin-bottom:12px;
}
h1{font-size:clamp(30px,8vw,48px);margin:0 0 8px;font-weight:900}
.sub{margin:0 0 22px;color:#e5e7eb;font-size:16px}
.card{
  background:rgba(255,255,255,.97);
  color:#111827;
  border-radius:28px;
  padding:22px;
  box-shadow:0 25px 70px rgba(0,0,0,.35);
}
.roulette{
  position:relative;
  width:min(390px,82vw);
  aspect-ratio:1;
  margin:5px auto 22px;
}
canvas{
  width:100%;
  height:100%;
  display:block;
  border-radius:50%;
}
.pointer{
  position:absolute;
  top:-8px;
  left:50%;
  transform:translateX(-50%);
  width:0;height:0;
  border-left:18px solid transparent;
  border-right:18px solid transparent;
  border-top:38px solid #111827;
  z-index:5;
  filter:drop-shadow(0 3px 2px rgba(0,0,0,.25));
}
.center{
  position:absolute;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:76px;height:76px;
  border-radius:50%;
  background:#111827;
  border:8px solid #fff;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:900;font-size:14px;
  z-index:4;
}
button{
  width:100%;
  border:0;
  border-radius:16px;
  padding:17px;
  font-size:20px;
  font-weight:900;
  color:#fff;
  background:linear-gradient(90deg,#e11d48,#7c3aed);
  cursor:pointer;
  box-shadow:0 10px 25px rgba(124,58,237,.3);
}
button:disabled{opacity:.5;cursor:not-allowed}
.result{
  display:none;
  margin-top:18px;
  padding:18px;
  border-radius:18px;
  background:#f3f4f6;
}
.result.show{display:block}
.result small{color:#6b7280}
.prize{font-size:30px;font-weight:1000;color:#e11d48;margin-top:5px}
.notice{font-size:12px;color:#6b7280;margin-top:14px;line-height:1.6}
.store{margin-top:16px;font-size:13px;color:#d1d5db}
</style>
</head>
<body>
<div class="wrap">
  <div class="badge">SK동대신점 특별 이벤트</div>
  <h1>New 아이폰18</h1>
  <p class="sub">사전예약 럭키 룰렛 🎁<br>룰렛을 돌리고 할인 혜택을 확인하세요!</p>

  <div class="card">
    <div class="roulette">
      <div class="pointer"></div>
      <canvas id="wheel" width="800" height="800"></canvas>
      <div class="center">LUCKY<br>ROULETTE</div>
    </div>

    <button id="spinBtn">🎯 룰렛 돌리기</button>

    <div id="result" class="result">
      <small>당첨 결과</small>
      <div id="prize" class="prize"></div>
      <div style="margin-top:8px;font-weight:700">축하드립니다! 매장에서 혜택을 확인해주세요.</div>
    </div>

    <div class="notice">
      ※ 본 이벤트는 매장 이벤트용으로 운영됩니다.<br>
      ※ 할인 혜택의 적용 조건 및 세부 내용은 매장 직원에게 문의해주세요.
    </div>
  </div>

  <div class="store">New 아이폰18 사전예약 · SK동대신점</div>
</div>

<script>
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const spinBtn = document.getElementById("spinBtn");
const resultBox = document.getElementById("result");
const prizeText = document.getElementById("prize");

const items = [
  {label:"20만원 할인", weight:20},
  {label:"15만원 할인", weight:30},
  {label:"10만원 할인", weight:50}
];

const colors = ["#e11d48","#7c3aed","#f59e0b"];
let rotation = 0;
let spinning = false;

function drawWheel(){
  const cx=400, cy=400, r=380;
  const slice = Math.PI*2/items.length;

  ctx.clearRect(0,0,800,800);

  items.forEach((item,i)=>{
    const start = rotation + i*slice - Math.PI/2;
    const end = start + slice;

    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,start,end);
    ctx.closePath();
    ctx.fillStyle=colors[i];
    ctx.fill();
    ctx.lineWidth=8;
    ctx.strokeStyle="#fff";
    ctx.stroke();

    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(start + slice/2);
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillStyle="#fff";
    ctx.font="900 42px Arial";
    ctx.fillText(item.label, r*0.58, 0);
    ctx.restore();
  });

  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.lineWidth=12;
  ctx.strokeStyle="#fff";
  ctx.stroke();
}

function pickPrize(){
  const total = items.reduce((a,b)=>a+b.weight,0);
  let n = Math.random()*total;
  for(const item of items){
    n -= item.weight;
    if(n <= 0) return item.label;
  }
  return items[items.length-1].label;
}

function spin(){
 if(spinning || wheelStart.disabled)return;
 spinning=true;
 participateBtn.disabled=true;
 wheelStart.disabled=true;
 result.classList.remove("show");

 const selected=weightedPick();
 const idx=prizes.findIndex(p=>p.name===selected);
 const slice=360/prizes.length;

 // 선택된 칸의 중앙이 위쪽 포인터(12시)에 정확히 오도록 계산
 const target=(360-(idx*slice+slice/2)+360)%360;
 const current=((rotation*180/Math.PI)%360+360)%360;
 const delta=(target-current+360)%360;
 const startDeg=rotation*180/Math.PI;
 const targetDeg=startDeg + 7*360 + delta;

 const duration=4800;
 const t0=performance.now();

 function frame(now){
   const t=Math.min(1,(now-t0)/duration);
   const ease=1-Math.pow(1-t,4);
   const deg=startDeg+(targetDeg-startDeg)*ease;
   rotation=deg*Math.PI/180;
   drawWheel();

   if(t<1) requestAnimationFrame(frame);
   else{
     prizeEl.textContent=selected+" 할인";
     result.classList.add("show");
     participateBtn.disabled=false;
     participateBtn.textContent="다시 참여하기";
     spinning=false;
   }
 }
 requestAnimationFrame(frame);
}

participateBtn.addEventListener("click",()=>{
 if(spinning)return;
 const value=phone.value.trim();

 // 번호는 선택사항. 입력했다면 숫자만 허용
 if(value && !/^01[0-9]{8,9}$/.test(value)){
   alert("휴대폰 번호를 정확히 입력해주세요.");
   phone.focus();
   return;
 }

 result.classList.remove("show");
 wheelStart.disabled=false;
 participateBtn.disabled=true;
 wheelStart.focus();
});

wheelStart.addEventListener("click",spin);

drawWheel();

    if(t<1){
      requestAnimationFrame(animate);
    }else{
      prizeText.textContent=prize;
      resultBox.classList.add("show");
      spinBtn.textContent="다시 돌리기";
      spinning=false;
      spinBtn.disabled=false;
    }
  }

  requestAnimationFrame(animate);
}

spinBtn.addEventListener("click",spin);
drawWheel();
</script>
</body>
</html>
