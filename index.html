<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>New 아이폰18 사전예약 럭키 룰렛</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(145deg,#07152d,#151b2e);font-family:Arial,"Noto Sans KR","Malgun Gothic",sans-serif;color:#fff;text-align:center}
.wrap{max-width:700px;margin:auto;padding:25px 12px 100px}
.badge{display:inline-block;background:#ef3d78;padding:8px 16px;border-radius:30px;font-weight:900}
h1{font-size:clamp(38px,10vw,60px);margin:14px 0 5px;font-weight:1000;letter-spacing:-3px}
h1 span{color:#ff67ad}
.sub{font-size:24px;font-weight:900;margin:12px 0}
.benefit{display:inline-block;background:#fff;color:#2870aa;border-radius:15px;padding:14px 24px;font-size:21px;font-weight:1000;margin-bottom:25px}
.guide{background:#fff;color:#222;border-radius:24px;padding:23px 12px;font-size:21px;font-weight:900;line-height:1.4}
.inputrow{display:flex;margin:20px auto 0;max-width:580px}
input{flex:1;min-width:0;padding:18px;border:2px solid #ddd;border-radius:17px 0 0 17px;font-size:19px}
#participate{width:130px;border:0;border-radius:0 17px 17px 0;background:#4022e8;color:#fff;font-size:19px;font-weight:900}
#participate:disabled{opacity:.55}
.wheel-wrap{position:relative;width:min(620px,96vw);aspect-ratio:1;margin:30px auto}
#wheel{width:100%;height:100%;display:block}
.pointer{position:absolute;z-index:10;top:0;left:50%;transform:translateX(-50%);width:0;height:0;border-left:27px solid transparent;border-right:27px solid transparent;border-top:52px solid #2861d5;filter:drop-shadow(0 3px 2px #0006)}
.pointer:after{content:"";position:absolute;left:-11px;top:-47px;width:22px;height:22px;border-radius:50%;background:#fff}
#startWheel{position:absolute;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);width:170px;height:170px;border-radius:50%;border:11px solid #1763aa;background:linear-gradient(135deg,#287be6,#8736db);box-shadow:0 8px 0 #123f77;color:#fff;font-size:30px;font-weight:1000;cursor:pointer}
#startWheel:disabled{opacity:.6;cursor:not-allowed}
.result{display:none;background:#fff;color:#222;border-radius:20px;padding:20px;margin-top:10px}
.result.show{display:block}
.prize{font-size:38px;font-weight:1000;color:#e11d48;margin:5px}
.note{color:#c6cbd4;font-size:13px;line-height:1.6}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#401be8;padding:17px;font-size:22px;font-weight:1000}
@media(max-width:430px){
 .guide{font-size:19px}
 #participate{width:115px;font-size:17px}
 input{font-size:16px;padding:17px 10px}
 #startWheel{width:145px;height:145px;font-size:26px}
}
</style>
</head>
<body>
<div class="wrap">
<div class="badge">SK동대신점 특별 이벤트</div>
<h1>New <span>아이폰18</span></h1>
<div class="sub">사전예약 럭키 룰렛</div>
<div class="benefit">최대 20만원 할인 혜택</div>

<div class="guide">휴대폰 번호를 입력하고<br><b>참여하기 → START</b> 순서로 눌러주세요!</div>

<div class="inputrow">
<input id="phone" type="tel" maxlength="11" placeholder="01012345678 (필수)">
<button id="participate">참여하기</button>
</div>

<div class="wheel-wrap">
<div class="pointer"></div>
<canvas id="wheel" width="1000" height="1000"></canvas>
<button id="startWheel" disabled>START</button>
</div>

<div id="result" class="result">
<div>🎉 당첨 결과</div>
<div id="prize" class="prize"></div>
<div>축하드립니다! 매장에서 할인 혜택을 확인해주세요.</div>
</div>
<div class="note">※ 휴대폰 번호당 1회 참여 가능 · 사전예약 상담 고객 대상 · 혜택은 매장 정책에 따라 적용</div>
</div>
<div class="bottom">New 아이폰18 사전예약 참여하기</div>

<script>
const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");
const participate=document.getElementById("participate");
const startWheel=document.getElementById("startWheel");
const phone=document.getElementById("phone");
const result=document.getElementById("result");
const prizeEl=document.getElementById("prize");

const prizes=[
 {name:"20만원",weight:20},
 {name:"15만원",weight:30},
 {name:"10만원",weight:50}
];
const fills=["#f8c8dc","#cfe2f7","#ffffff"];
let rotation=0;
let spinning=false;

function drawWheel(){
 const cx=500,cy=500,r=470;
 const slice=2*Math.PI/prizes.length;
 ctx.clearRect(0,0,1000,1000);

 for(let i=0;i<prizes.length;i++){
   const start=-Math.PI/2+rotation+i*slice;
   const end=start+slice;

   ctx.beginPath();
   ctx.moveTo(cx,cy);
   ctx.arc(cx,cy,r,start,end);
   ctx.closePath();
   ctx.fillStyle=fills[i];
   ctx.fill();
   ctx.lineWidth=8;
   ctx.strokeStyle="#fff";
   ctx.stroke();

   // 금액을 각 칸의 정확한 중앙에 배치
   const mid=start+slice/2;
   const tx=cx+Math.cos(mid)*r*0.62;
   const ty=cy+Math.sin(mid)*r*0.62;

   ctx.save();
   ctx.translate(tx,ty);
   let angle=mid+Math.PI/2;
   if(angle>Math.PI/2 && angle<Math.PI*1.5) angle-=Math.PI;
   ctx.rotate(angle);
   ctx.fillStyle="#172b5f";
   ctx.font="900 58px Arial";
   ctx.textAlign="center";
   ctx.textBaseline="middle";
   ctx.fillText(prizes[i].name,0,0);
   ctx.restore();
 }
 ctx.beginPath();
 ctx.arc(cx,cy,r,0,Math.PI*2);
 ctx.lineWidth=14;
 ctx.strokeStyle="#55a0ef";
 ctx.stroke();
}

// ===== 서버 설정 =====
// Google Apps Script 배포 후 받은 /exec 주소를 여기에 붙여넣으세요.
const API_URL = "https://script.google.com/macros/s/AKfycbz_krMN2ouYArCIWtb7gWofvaqJ3zn0XfmW5qdqHLJ6BQDMHbgC5WC8YvlyLvsiEm51Ww/exec";

let serverPrize = null;
let participantPhone = null;

function requestParticipation(phoneValue){
  return new Promise((resolve,reject)=>{
    if(!API_URL || API_URL.includes("여기에_")){
      reject(new Error("API_URL_NOT_SET"));
      return;
    }

    // Google Apps Script는 JSONP 방식으로 호출한다.
    // 캐시 방지를 위해 매 요청마다 고유한 cache 값을 추가한다.
    const callbackName = "rouletteCallback_" + Date.now() + "_" + Math.floor(Math.random()*100000);
    const script = document.createElement("script");
    let finished = false;

    const timer = setTimeout(()=>{
      if(finished) return;
      finished = true;
      cleanup();
      reject(new Error("TIMEOUT"));
    },15000);

    function cleanup(){
      clearTimeout(timer);
      if(script.parentNode) script.parentNode.removeChild(script);
      try{ delete window[callbackName]; }catch(e){}
    }

    window[callbackName] = (data)=>{
      if(finished) return;
      finished = true;

      if(data && data.ok){
        cleanup();
        resolve(data);
      }else{
        const message = (data && data.message) || "SERVER_ERROR";
        cleanup();
        reject(new Error(message));
      }
    };

    script.async = true;
    script.src = API_URL
      + "?action=participate"
      + "&phone=" + encodeURIComponent(phoneValue)
      + "&callback=" + encodeURIComponent(callbackName)
      + "&_=" + Date.now();

    script.onerror=()=>{
      if(finished) return;
      finished = true;
      cleanup();
      reject(new Error("NETWORK_ERROR"));
    };

    document.head.appendChild(script);
  });
}

participate.addEventListener("click", async ()=>{
  if(spinning || participate.disabled)return;

  const v=phone.value.trim().replace(/[^0-9]/g,"");
  if(!/^01[0-9]{8,9}$/.test(v)){
    alert("휴대폰 번호를 정확히 입력해주세요.");
    return;
  }

  participate.disabled=true;
  participate.textContent="확인 중...";

  try{
    const data=await requestParticipation(v);

    // 서버에서 번호 중복 여부와 당첨 금액을 결정
    participantPhone=v;
    serverPrize=data.prize;

    result.classList.remove("show");
    startWheel.disabled=false;
    participate.textContent="참여 완료";
  }catch(err){
    participate.disabled=false;
    participate.textContent="참여하기";

    if(err.message==="API_URL_NOT_SET"){
      alert("관리자 설정이 필요합니다. API_URL을 먼저 입력해주세요.");
    }else if(err.message==="TIMEOUT" || err.message==="NETWORK_ERROR"){
      alert("서버 연결이 원활하지 않습니다. 잠시 후 다시 시도해주세요.");
    }else{
      alert(err.message || "참여 처리 중 오류가 발생했습니다.");
    }
  }
});

startWheel.addEventListener("click",()=>{
 if(spinning || startWheel.disabled || !serverPrize)return;
 spinning=true;
 startWheel.disabled=true;

 const selected=serverPrize;
 const index=prizes.findIndex(p=>p.name===selected);
 const sliceDeg=360/prizes.length;

 const current=((rotation*180/Math.PI)%360+360)%360;
 const desired=(360-(index*sliceDeg+sliceDeg/2)+360)%360;
 const delta=(desired-current+360)%360;
 const startDeg=rotation*180/Math.PI;
 const endDeg=startDeg+7*360+delta;
 const duration=4500;
 const t0=performance.now();

 function animate(now){
   const t=Math.min(1,(now-t0)/duration);
   const ease=1-Math.pow(1-t,4);
   rotation=(startDeg+(endDeg-startDeg)*ease)*Math.PI/180;
   drawWheel();

   if(t<1){
     requestAnimationFrame(animate);
   }else{
     prizeEl.textContent=selected+" 할인";
     result.classList.add("show");
     participate.disabled=true;
     participate.textContent="참여 완료";
     phone.disabled=true;
     spinning=false;
   }
 }
 requestAnimationFrame(animate);
});

drawWheel();

</script>
</body>
</html>
